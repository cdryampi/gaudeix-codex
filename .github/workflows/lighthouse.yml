name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        run: pnpm --filter frontend build

      - name: Build Backoffice
        run: pnpm --filter backoffice build

      - name: Run Lighthouse (Frontend)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:5173/
          staticDistDir: ./frontend/dist
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Run Lighthouse (Backoffice)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:5174/
          staticDistDir: ./backoffice/dist
          uploadArtifacts: true
          temporaryPublicStorage: true
