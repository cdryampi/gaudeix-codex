name: Lighthouse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Frontend
        run: pnpm --filter frontend build

      - name: Build Backoffice
        run: pnpm --filter backoffice build

      - name: Start static servers
        run: |
          python3 -m http.server 5173 --directory frontend/dist >/tmp/frontend-http.log 2>&1 &
          python3 -m http.server 5174 --directory backoffice/dist >/tmp/backoffice-http.log 2>&1 &

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null && curl -fsS http://127.0.0.1:5174/ >/dev/null; then
              echo "Static servers are ready"
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:5173/ >/dev/null
          curl -fsS http://127.0.0.1:5174/ >/dev/null

      - name: Run Lighthouse (Frontend)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://127.0.0.1:5173/
          uploadArtifacts: true
          artifactName: lighthouse-frontend
          temporaryPublicStorage: true

      - name: Run Lighthouse (Backoffice)
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://127.0.0.1:5174/
          uploadArtifacts: true
          artifactName: lighthouse-backoffice
          temporaryPublicStorage: true
