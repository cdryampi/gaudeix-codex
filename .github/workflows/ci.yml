name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Django check
        env:
          ENVIRONMENT: test
          DJANGO_SECRET_KEY: ci-secret-key
        run: python manage.py check --settings=config.settings.test

      - name: Pytest
        env:
          ENVIRONMENT: test
          DJANGO_SECRET_KEY: ci-secret-key
        run: pytest

  web:
    name: Frontend and backoffice
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter frontend lint && pnpm --filter backoffice lint

      - name: Type-check
        run: pnpm --filter frontend type-check && pnpm --filter backoffice type-check

      - name: Test
        run: pnpm --filter frontend exec vitest run && pnpm --filter backoffice test

      - name: Build Pages artifact
        env:
          VITE_API_BASE_URL: https://gaudeix.yampi.eu/api/v1
          VITE_BASE_PATH: /gaudeix-codex/
        run: pnpm build:pages
