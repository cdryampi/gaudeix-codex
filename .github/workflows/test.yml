name: Feature CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Django system check
        run: python manage.py check --settings=config.settings.test

      - name: Run backend feature tests
        run: pytest automations/tests beach_safety/tests gaudeix_backend/tests/test_seed_all.py

  web-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Frontend type check
        run: pnpm --filter frontend type-check

      - name: Frontend tests
        run: pnpm --filter frontend exec vitest run

      - name: Backoffice type check
        run: pnpm --filter backoffice type-check

      - name: Backoffice tests
        run: pnpm --filter backoffice exec vitest run

      - name: Build frontend
        run: pnpm --filter frontend build

      - name: Build backoffice
        run: pnpm --filter backoffice build
