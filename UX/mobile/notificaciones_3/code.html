<!DOCTYPE html>
<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f36b21", // Gaudeix Orange
                        "secondary": "#1a1a1a",
                        "background-light": "#ffffff",
                        "background-dark": "#121212",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style type="text/tailwindcss">
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .fill-icon {
            font-variation-settings: 'FILL' 1;
        }
        .bg-route-pattern {
            background-image: radial-gradient(circle at 2px 2px, #f36b21 1px, transparent 0);
            background-size: 24px 24px;
            opacity: 0.05;
        }
    </style>
<style>
        body {
            min-height: max(844px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display antialiased text-secondary dark:text-white">
<div class="relative flex h-screen w-full flex-col overflow-x-hidden max-w-[430px] mx-auto shadow-2xl bg-background-light dark:bg-background-dark">
<header class="sticky top-0 z-10 flex items-center bg-white/80 dark:bg-black/80 backdrop-blur-md px-4 py-4 justify-between">
<div class="flex size-10 items-center justify-start">
<span class="material-symbols-outlined text-primary text-2xl font-bold cursor-pointer">chevron_left</span>
</div>
<h2 class="text-secondary dark:text-white text-lg font-bold leading-tight flex-1 text-center tracking-tight">Gaudeix</h2>
<div class="size-10"></div>
</header>
<main class="flex-1 flex flex-col items-center justify-center px-8 text-center relative overflow-hidden">
<div class="absolute inset-0 bg-route-pattern pointer-events-none"></div>
<div class="relative mb-12 w-full max-w-[260px]">
<div class="aspect-square bg-orange-50 dark:bg-neutral-900 rounded-3xl flex items-center justify-center relative overflow-hidden border border-primary/10">
<svg class="absolute inset-0 w-full h-full opacity-20" fill="none" viewBox="0 0 100 100">
<path d="M-10 30 L40 30 L40 70 L110 70" stroke="#f36b21" stroke-linecap="round" stroke-width="2"></path>
<path d="M20 -10 L20 50 L60 50 L60 110" stroke="#f36b21" stroke-linecap="round" stroke-width="2"></path>
<circle cx="20" cy="50" fill="#f36b21" r="1.5"></circle>
<circle cx="40" cy="30" fill="#f36b21" r="1.5"></circle>
<circle cx="40" cy="70" fill="#f36b21" r="1.5"></circle>
<circle cx="60" cy="50" fill="#f36b21" r="1.5"></circle>
</svg>
<div class="relative z-10 flex flex-col items-center">
<div class="relative">
<span class="material-symbols-outlined text-primary text-8xl fill-icon">location_on</span>
<div class="absolute -top-1 -right-1 flex h-4 w-4">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-red-400 opacity-75"></span>
<span class="relative inline-flex rounded-full h-4 w-4 bg-red-500"></span>
</div>
</div>
</div>
</div>
<div class="absolute -bottom-4 left-1/2 -translate-x-1/2 bg-white dark:bg-neutral-800 px-4 py-2 rounded-full shadow-lg border border-primary/20 flex items-center gap-2">
<span class="material-symbols-outlined text-primary text-sm">wifi_off</span>
<span class="text-[10px] font-bold uppercase tracking-wider text-neutral-500">Sin conexión</span>
</div>
</div>
<h1 class="text-2xl font-extrabold text-secondary dark:text-white mb-4 px-2">
                ¡Vaya! Parece que te has salido de la ruta
            </h1>
<p class="text-neutral-500 dark:text-neutral-400 text-[15px] leading-relaxed mb-10 max-w-[280px]">
                Revisa tu conexión para seguir disfrutando del pueblo.
            </p>
<div class="w-full max-w-[300px]">
<button class="w-full bg-primary hover:bg-orange-600 text-white font-bold py-4 rounded-full shadow-lg shadow-primary/30 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-xl">refresh</span>
                    Reintentar
                </button>
</div>
</main>
<footer class="p-6 text-center">
<p class="text-[10px] text-neutral-400 dark:text-neutral-600 font-bold uppercase tracking-[0.2em]">
                Gaudeix Turisme • Cultural
            </p>
<div class="h-1 mt-6 flex justify-center">
<div class="w-32 h-1 bg-neutral-200 dark:bg-neutral-800 rounded-full"></div>
</div>
</footer>
</div>

</body></html>
