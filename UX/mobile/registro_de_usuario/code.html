<!DOCTYPE html>

<html class="light" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#e74727",
                        "background-light": "#fdfdfc",
                        "background-dark": "#1a1a1a",
                        "success-teal": "#00A389",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"],
                        "heading": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .ios-blur {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .soft-focus-shadow {
            box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.05);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#1b100e] dark:text-gray-100 min-h-screen flex flex-col">
<!-- Top Navigation Bar (iOS Style) -->
<header class="sticky top-0 z-50 bg-background-light/80 dark:bg-background-dark/80 ios-blur px-4 py-3 flex items-center justify-between">
<button class="flex items-center justify-center size-10 rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
<span class="material-symbols-outlined text-[#1b100e] dark:text-white">arrow_back_ios_new</span>
</button>
<h2 class="text-[#1b100e] dark:text-white text-lg font-bold font-heading tracking-tight">Registro</h2>
<div class="size-10"></div> <!-- Placeholder for layout balance -->
</header>
<main class="flex-1 flex flex-col px-6 pb-12 max-w-md mx-auto w-full">
<!-- Headline Section -->
<div class="pt-8 pb-6">
<h1 class="text-[#1b100e] dark:text-white font-heading text-[36px] font-bold leading-[1.1] tracking-tight mb-2">
                Únete a Gaudeix
            </h1>
<p class="text-[#6b5a55] dark:text-gray-400 text-lg font-medium leading-relaxed">
                Empieza a descubrir eventos locales y suma puntos exclusivos.
            </p>
</div>
<!-- Form Section -->
<div class="space-y-5">
<!-- Name Field -->
<div class="flex flex-col gap-2">
<label class="text-[#1b100e] dark:text-gray-200 text-sm font-bold uppercase tracking-wider ml-1">
                    Nombre completo
                </label>
<div class="relative group">
<input class="form-input w-full rounded-xl border-[#e7d4d0] dark:border-gray-700 bg-white dark:bg-[#252525] focus:border-primary focus:ring-2 focus:ring-primary/20 h-14 px-4 text-base transition-all dark:text-white" placeholder="Ej. Marc Torrent" type="text"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 material-symbols-outlined text-success-teal opacity-0 group-focus-within:opacity-100 transition-opacity">check_circle</span>
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="text-[#1b100e] dark:text-gray-200 text-sm font-bold uppercase tracking-wider ml-1">
                    Correo electrónico
                </label>
<div class="relative">
<input class="form-input w-full rounded-xl border-[#e7d4d0] dark:border-gray-700 bg-white dark:bg-[#252525] focus:border-primary focus:ring-2 focus:ring-primary/20 h-14 px-4 text-base transition-all dark:text-white" placeholder="nombre@ejemplo.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<label class="text-[#1b100e] dark:text-gray-200 text-sm font-bold uppercase tracking-wider ml-1">
                    Contraseña
                </label>
<div class="relative">
<input class="form-input w-full rounded-xl border-[#e7d4d0] dark:border-gray-700 bg-white dark:bg-[#252525] focus:border-primary focus:ring-2 focus:ring-primary/20 h-14 px-4 text-base transition-all dark:text-white" placeholder="Mínimo 8 caracteres" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
</div>
<!-- Primary Action -->
<div class="mt-8 space-y-4">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-all text-lg flex items-center justify-center gap-2">
                Crear cuenta y empezar a sumar
                <span class="material-symbols-outlined">stars</span>
</button>
<p class="text-center text-sm font-medium text-[#6b5a55] dark:text-gray-400">
                ¿Ya tienes cuenta? 
                <a class="text-primary font-bold hover:underline decoration-2 underline-offset-4 ml-1" href="#">Inicia sesión</a>
</p>
</div>
<!-- Social Register Divider -->
<div class="mt-12 mb-6 flex items-center gap-4">
<div class="flex-1 h-px bg-[#e7d4d0] dark:bg-gray-800"></div>
<span class="text-xs font-bold text-[#975a4e] uppercase tracking-[0.2em]">O regístrate con</span>
<div class="flex-1 h-px bg-[#e7d4d0] dark:bg-gray-800"></div>
</div>
<!-- Social Buttons -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 h-14 rounded-xl border-2 border-[#e7d4d0] dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors font-bold text-sm">
<img alt="" class="size-5" data-alt="Logotipo de Google para registro" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDafQZ2538HoEaMQ1EtHrY9MKwZdBh7B6Tp--Lc_TrW9GF75I51h9cs5MvHSvCRy77kZXfMKrjo2t8TIfuCzJpJtIh0Tsx6GhOLSJqK_z9OvKw2_05GFjvKRxcl2s65g2EocgjZDAK0bngG7IRYig1qHtW112s5CW25cODwfGo4FsfaYwp-kyhuEBTqzeqghZ8ZlfMyv1hGhSBrOm94UrZsIzQSShVg7pcSLUBQSjcvyTZaGN2cbKN6IeIJzZP3orrs7dYaQOYaVKM"/>
                Google
            </button>
<button class="flex items-center justify-center gap-3 h-14 rounded-xl border-2 border-[#e7d4d0] dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-800 transition-colors font-bold text-sm">
<span class="material-symbols-outlined text-xl">ios</span>
                Apple
            </button>
</div>
<!-- Legal Disclaimer -->
<div class="mt-auto pt-10 text-center">
<p class="text-[11px] leading-relaxed text-[#975a4e] dark:text-gray-500 font-medium">
                Al registrarte, confirmas que has leído y aceptas nuestra <br/>
<a class="underline font-bold text-primary/80" href="#">Política de Privacidad</a> y <a class="underline font-bold text-primary/80" href="#">Términos de Uso</a>.
            </p>
</div>
</main>
<!-- Bottom Indicator (iOS Style) -->
<div class="flex justify-center pb-2">
<div class="w-32 h-1.5 bg-gray-300 dark:bg-gray-700 rounded-full"></div>
</div>
</body></html>
